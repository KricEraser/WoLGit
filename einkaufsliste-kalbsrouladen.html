<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>:root{color-scheme:light dark} html,body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>
<title>Kalbsrouladen &amp; Gratin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDF0F0; --surface:#FFFFFF; --surface-2:#F5F8F8;
  --ink:#132630; --ink-soft:#5B6E78; --ink-faint:#8A9AA2;
  --rule:#D2DBDC; --rule-soft:#E4EAEB;
  --blue:#175A78; --blue-soft:#E2EDF1;
  --mustard:#A8751A; --mustard-fill:#C4901F;
  --on-blue:#FFFFFF;
  --lift:0 1px 0 rgba(19,38,48,.03), 0 10px 24px -18px rgba(19,38,48,.45);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --cond:'Barlow Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#101A1E; --surface:#17232A; --surface-2:#1C2A31;
    --ink:#E7EDEE; --ink-soft:#98ABB3; --ink-faint:#6E828B;
    --rule:#27373F; --rule-soft:#203037;
    --blue:#7CBBD6; --blue-soft:#1B2F39;
    --mustard:#DDAA48; --mustard-fill:#C39033;
    --on-blue:#0F1A1F;
    --lift:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --ground:#101A1E; --surface:#17232A; --surface-2:#1C2A31;
  --ink:#E7EDEE; --ink-soft:#98ABB3; --ink-faint:#6E828B;
  --rule:#27373F; --rule-soft:#203037;
  --blue:#7CBBD6; --blue-soft:#1B2F39;
  --mustard:#DDAA48; --mustard-fill:#C39033;
  --on-blue:#0F1A1F;
  --lift:0 1px 0 rgba(0,0,0,.25), 0 10px 26px -18px rgba(0,0,0,.9);
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:620px; margin:0 auto; padding-inline:18px; padding-block:24px 44px;}

/* ---------- Kopf ---------- */
.eyebrow{
  margin:0 0 6px; font-family:var(--cond); font-weight:600;
  text-transform:uppercase; letter-spacing:.14em; font-size:.82rem;
  color:var(--blue);
}
h1{
  margin:0; font-family:var(--cond); font-weight:700;
  font-size:clamp(2.2rem,10vw,3.1rem); line-height:.94;
  letter-spacing:-.005em; text-wrap:balance;
}
h1 .sub{display:block; font-weight:500; color:var(--ink-soft); font-size:.5em; letter-spacing:.01em; margin-top:.28em;}

.meter{
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  margin-top:22px;
}
.meter .count{font-family:var(--cond); font-weight:700; font-size:2.4rem; line-height:1; font-variant-numeric:tabular-nums;}
.meter .count small{font-size:.44em; font-weight:600; color:var(--ink-faint); margin-left:.15em;}
.meter .status{font-size:.83rem; color:var(--ink-soft); text-align:right; max-width:17ch;}
.rail{height:5px; background:var(--rule-soft); border-radius:2px; margin-top:10px; overflow:hidden;}
.rail span{display:block; height:100%; width:0; background:var(--mustard-fill); transition:width .28s ease;}
body.done .rail span{background:var(--blue)}
body.done .meter .count{color:var(--blue)}

/* ---------- Bedienleiste ---------- */
.bar{
  display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
  margin-top:22px; padding:12px 14px;
  background:var(--surface); border:1px solid var(--rule); border-radius:5px;
  box-shadow:var(--lift);
}
.field{display:flex; align-items:center; gap:10px;}
.field > .lbl{
  font-family:var(--cond); font-weight:600; text-transform:uppercase;
  letter-spacing:.1em; font-size:.76rem; color:var(--ink-soft);
}
.stepper{display:flex; align-items:center; border:1px solid var(--rule); border-radius:4px; overflow:hidden;}
.stepper button{
  width:34px; height:32px; border:0; background:var(--surface-2); color:var(--ink);
  font-size:1.15rem; line-height:1; cursor:pointer; font-family:var(--sans);
}
.stepper button:hover:not(:disabled){background:var(--blue-soft); color:var(--blue)}
.stepper button:disabled{color:var(--ink-faint); cursor:not-allowed}
.stepper output{
  min-width:62px; text-align:center; font-family:var(--mono); font-size:.9rem;
  font-variant-numeric:tabular-nums; border-inline:1px solid var(--rule); padding:0 6px; line-height:32px;
}
.seg{display:flex; margin-left:auto; border:1px solid var(--rule); border-radius:4px; overflow:hidden;}
.seg button{
  border:0; background:var(--surface-2); color:var(--ink-soft); cursor:pointer;
  font-family:var(--cond); font-weight:600; font-size:.88rem; letter-spacing:.04em;
  text-transform:uppercase; padding:8px 12px;
}
.seg button + button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--blue); color:var(--on-blue);}

/* ---------- Gruppen ---------- */
.group{margin-top:28px}
.group-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:14px;
  padding-bottom:7px; border-bottom:2px solid var(--ink);
}
.group-head h2{
  margin:0; font-family:var(--cond); font-weight:700; font-size:1.28rem;
  text-transform:uppercase; letter-spacing:.06em; text-wrap:balance;
}
.group-head .tally{font-family:var(--mono); font-size:.8rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; flex:none;}
.group .hint{margin:8px 0 0; font-size:.82rem; color:var(--ink-faint); line-height:1.35;}

ul.items{list-style:none; margin:0; padding:0;}
ul.items li + li{border-top:1px solid var(--rule-soft)}

.row{
  display:grid; grid-template-columns:auto 1fr auto; gap:6px 13px;
  align-items:start; padding:13px 12px 13px 10px; cursor:pointer;
  border-left:3px solid transparent; background:var(--surface);
  transition:background .15s ease, border-color .15s ease;
}
.row:hover{background:var(--surface-2)}
.row input{position:absolute; opacity:0; width:1px; height:1px;}
.box{
  width:25px; height:25px; margin-top:1px; flex:none;
  border:1.5px solid var(--ink-soft); border-radius:3px; background:transparent;
  position:relative; transition:background .15s ease, border-color .15s ease;
}
.box::after{
  content:""; position:absolute; inset:0; margin:auto;
  width:6px; height:11px; border:solid #fff; border-width:0 2.5px 2.5px 0;
  transform:rotate(42deg) translateY(-1px) scale(.4); opacity:0;
  transition:opacity .15s ease, transform .15s ease;
}
.name{font-weight:500; text-wrap:pretty}
.note{grid-column:2; font-size:.82rem; color:var(--ink-soft); line-height:1.35; margin-top:1px;}
.qty{
  font-family:var(--mono); font-size:.88rem; font-variant-numeric:tabular-nums;
  white-space:nowrap; color:var(--ink); padding-top:2px; text-align:right;
}
.chip{
  display:inline-block; margin-left:8px; vertical-align:1px; white-space:nowrap;
  font-family:var(--cond); font-weight:600; text-transform:uppercase;
  letter-spacing:.09em; font-size:.7rem; color:var(--ink-faint);
  border-bottom:1px solid var(--rule);
}
.row input:focus-visible + .box{outline:2px solid var(--blue); outline-offset:2px}

.row.on{border-left-color:var(--mustard-fill); background:var(--surface-2)}
.row.on .box{background:var(--mustard-fill); border-color:var(--mustard-fill)}
.row.on .box::after{opacity:1; transform:rotate(42deg) translateY(-1px) scale(1)}
.row.on .name{text-decoration:line-through; text-decoration-thickness:1.5px; text-decoration-color:var(--ink-faint); color:var(--ink-soft)}
.row.on .note, .row.on .qty{color:var(--ink-faint)}

/* ---------- Reiter ---------- */
.tabs{display:flex; gap:26px; margin-top:24px; border-bottom:1px solid var(--rule);}
.tabs button{
  border:0; background:none; cursor:pointer; padding:0 0 10px; margin-bottom:-1px;
  font-family:var(--cond); font-weight:600; font-size:1.12rem; letter-spacing:.05em;
  text-transform:uppercase; color:var(--ink-faint); border-bottom:2px solid transparent;
}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--mustard-fill);}
.tabs button:hover{color:var(--ink)}

/* ---------- Zeitplan ---------- */
.plan{margin-top:26px; padding:16px 16px 6px; background:var(--surface); border:1px solid var(--rule); border-radius:5px;}
.plan-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-bottom:14px;}
.plan-head h2{
  margin:0; font-family:var(--cond); font-weight:600; font-size:.82rem;
  text-transform:uppercase; letter-spacing:.14em; color:var(--blue); flex:1;
}
.plan-head label{font-size:.84rem; color:var(--ink-soft)}
.plan-head input{
  font-family:var(--mono); font-size:.92rem; margin-left:8px; padding:5px 8px;
  border:1px solid var(--rule); border-radius:4px; background:var(--surface-2);
  color:var(--ink); color-scheme:inherit;
}
.plan ol{list-style:none; margin:0; padding:0 0 10px; position:relative;}
.plan ol::before{content:""; position:absolute; left:52px; top:6px; bottom:16px; width:1px; background:var(--rule);}
.plan li{display:grid; grid-template-columns:46px 1fr; gap:14px; align-items:baseline; padding:6px 0; position:relative;}
.plan li::before{
  content:""; position:absolute; left:49px; top:11px; width:7px; height:7px;
  border-radius:50%; background:var(--rule); border:1.5px solid var(--surface);
}
.plan li.key::before{background:var(--mustard-fill)}
.plan .t{font-family:var(--mono); font-size:.88rem; font-variant-numeric:tabular-nums; color:var(--ink-soft); text-align:right;}
.plan li.key .t{color:var(--ink); font-weight:500}
.plan .what{font-size:.9rem; padding-left:10px}
.plan li.key .what{font-weight:500}

/* ---------- Kochschritte ---------- */
.phase{margin-top:28px}
.phase-head{display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding-bottom:7px; border-bottom:2px solid var(--ink);}
.phase-head h2{margin:0; font-family:var(--cond); font-weight:700; font-size:1.28rem; text-transform:uppercase; letter-spacing:.06em;}
.phase-head .dur{font-family:var(--mono); font-size:.8rem; color:var(--ink-soft); flex:none; white-space:nowrap;}
ul.steps{list-style:none; margin:0; padding:0}
ul.steps li + li{border-top:1px solid var(--rule-soft)}
.step{
  display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
  padding:14px 12px 14px 10px; cursor:pointer; border-left:3px solid transparent;
  background:var(--surface); transition:background .15s ease, border-color .15s ease;
}
.step:hover{background:var(--surface-2)}
.step input{position:absolute; opacity:0; width:1px; height:1px;}
.num{
  width:26px; height:26px; flex:none; display:grid; place-items:center;
  font-family:var(--cond); font-weight:600; font-size:.95rem; line-height:1;
  border:1.5px solid var(--ink-soft); border-radius:3px; color:var(--ink-soft);
  font-variant-numeric:tabular-nums; transition:background .15s ease, color .15s ease, border-color .15s ease;
}
.step .text{line-height:1.5; text-wrap:pretty}
.step input:focus-visible + .num{outline:2px solid var(--blue); outline-offset:2px}
.step.on{border-left-color:var(--mustard-fill); background:var(--surface-2)}
.step.on .num{background:var(--mustard-fill); border-color:var(--mustard-fill); color:var(--surface)}
.step.on .text{color:var(--ink-faint)}
.step .text b{font-weight:600; font-family:var(--mono); font-size:.92em; color:inherit;}

/* ---------- Fuß ---------- */


.foot{
  display:flex; flex-wrap:wrap; align-items:center; gap:12px;
  margin-top:18px; font-size:.8rem; color:var(--ink-faint);
}
.sync{display:flex; align-items:center; gap:7px}
.dot{width:7px; height:7px; border-radius:50%; background:var(--ink-faint); flex:none}
.sync.live .dot{background:var(--mustard-fill)}
#reset{
  margin-left:auto; border:1px solid var(--rule); background:var(--surface);
  color:var(--ink-soft); font-family:var(--sans); font-size:.8rem;
  padding:7px 12px; border-radius:4px; cursor:pointer;
}
#reset:hover{color:var(--ink); border-color:var(--ink-soft)}
#reset.armed{border-color:var(--mustard); color:var(--mustard)}
button:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <p class="eyebrow">Einkaufszettel</p>
    <h1>Kalbsrouladen<span class="sub">mit Kartoffelgratin</span></h1>

    <div class="meter">
      <div class="count" id="count">0<small>/21</small></div>
      <div class="status" id="status">Noch nichts im Wagen</div>
    </div>
    <div class="rail"><span id="rail"></span></div>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" id="t-einkauf" role="tab" aria-selected="true" aria-controls="list">Einkauf</button>
    <button type="button" id="t-kochen" role="tab" aria-selected="false" aria-controls="recipe">Zubereitung</button>
  </div>

  <div class="bar">
    <div class="field">
      <span class="lbl" id="lbl-portionen">Portionen</span>
      <div class="stepper">
        <button type="button" id="minus" aria-label="Eine Portion weniger">−</button>
        <output id="servings" for="minus plus" aria-labelledby="lbl-portionen">4 Personen</output>
        <button type="button" id="plus" aria-label="Eine Portion mehr">+</button>
      </div>
    </div>
    <div class="seg" id="sortierung" role="group" aria-label="Sortierung">
      <button type="button" id="v-route" aria-pressed="true">Ladenweg</button>
      <button type="button" id="v-dish" aria-pressed="false">Gericht</button>
    </div>
  </div>

  <main id="list" role="tabpanel" aria-labelledby="t-einkauf"></main>

  <div id="recipe" role="tabpanel" aria-labelledby="t-kochen" hidden>
    <section class="plan">
      <div class="plan-head">
        <h2>Rückwärts geplant</h2>
        <label for="mealtime">Essen um<input type="time" id="mealtime" value="18:00"></label>
      </div>
      <ol id="plan-list"></ol>
    </section>
    <div id="steps"></div>
  </div>

  <div class="foot">
    <span class="sync" id="sync"><span class="dot"></span><span id="sync-text">Nur auf diesem Gerät gespeichert</span></span>
    <button type="button" id="reset">Alles abwählen</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ITEMS = [
    {id:'rouladen',    name:'Kalbsrouladen',                aisle:'theke',     dish:'rouladen', per:1,   unit:'Stück', note:'Aus der Oberschale, dünn geschnitten — vom Metzger flach klopfen lassen, je ca. 160 g.'},
    {id:'kartoffeln',  name:'Festkochende Kartoffeln',      aisle:'gemuese',   dish:'gratin',   per:375, step:250, unit:'g', note:'Linda oder Annabelle — sie zerfallen beim Backen nicht.'},
    {id:'zwiebeln',    name:'Zwiebeln',                     aisle:'gemuese',   dish:'rouladen', per:0.75, unit:'Stück', note:'Zwei in die Füllung, eine in den Schmorfond.'},
    {id:'knoblauch',   name:'Knoblauch',                    aisle:'gemuese',   dish:'gratin',   fixed:'1 Zehe', note:'Halbiert, zum Ausreiben der Gratinform.'},
    {id:'suppengruen', name:'Suppengrün',                   aisle:'gemuese',   dish:'sauce',    fixed:'1 Bund', note:'Möhre, Sellerie, Lauch — Grundlage der Soße.'},
    {id:'petersilie',  name:'Glatte Petersilie',            aisle:'gemuese',   dish:'sauce',    fixed:'½ Bund', note:'Zum Schluss über die Soße.'},
    {id:'speck',       name:'Frühstücksspeck in Scheiben',  aisle:'kuehl',     dish:'rouladen', per:25,  step:25,  unit:'g', note:'Legt die Rouladen innen aus.'},
    {id:'sahne',       name:'Sahne',                        aisle:'kuehl',     dish:'gratin',   per:50,  step:50,  unit:'ml'},
    {id:'milch',       name:'Milch',                        aisle:'kuehl',     dish:'gratin',   per:50,  step:50,  unit:'ml'},
    {id:'kaese',       name:'Bergkäse oder Gruyère',        aisle:'kuehl',     dish:'gratin',   per:40,  step:25,  unit:'g', note:'Am Stück kaufen und selbst reiben — schmilzt deutlich besser.'},
    {id:'butter',      name:'Butter',                       aisle:'kuehl',     dish:'gratin',   per:15,  step:25,  unit:'g', note:'Für die Form und zum Anbraten.'},
    {id:'gurken',      name:'Gewürzgurken',                 aisle:'trocken',   dish:'rouladen', fixed:'1 Glas', note:'Mittelgroß, längs geviertelt.'},
    {id:'fond',        name:'Kalbs- oder Rinderfond',       aisle:'trocken',   dish:'sauce',    per:125, step:100, unit:'ml', note:'Notfalls kräftige Brühe.'},
    {id:'senf',        name:'Mittelscharfer Senf',          aisle:'trocken',   dish:'rouladen', fixed:'1 Glas', pantry:true, note:'Zum Bestreichen vor dem Füllen.'},
    {id:'tomatenmark', name:'Tomatenmark',                  aisle:'trocken',   dish:'sauce',    fixed:'1 Dose', pantry:true},
    {id:'mehl',        name:'Mehl oder Speisestärke',       aisle:'trocken',   dish:'sauce',    fixed:'2 EL',   pantry:true, note:'Zum Andicken am Ende.'},
    {id:'gewuerze',    name:'Lorbeer & Wacholderbeeren',    aisle:'trocken',   dish:'sauce',    fixed:'je 2–3', pantry:true},
    {id:'muskat',      name:'Muskatnuss',                   aisle:'trocken',   dish:'gratin',   fixed:'1 Stück', pantry:true, note:'Frisch in die Gratinsahne reiben.'},
    {id:'salzpfeffer', name:'Salz & Pfeffer',               aisle:'trocken',   dish:'rouladen', fixed:'nach Bedarf', pantry:true},
    {id:'rotwein',     name:'Trockener Rotwein',            aisle:'getraenke', dish:'sauce',    per:60,  step:50,  unit:'ml', note:'Zum Ablöschen — der Rest passt zum Essen.'},
    {id:'garn',        name:'Küchengarn oder Rouladennadeln', aisle:'haushalt', dish:'rouladen', fixed:'1 Rolle', pantry:true}
  ];

  var AISLES = [
    ['theke','Fleischtheke','Am besten einen Tag vorher bestellen'],
    ['gemuese','Obst & Gemüse',''],
    ['kuehl','Kühlregal & Molkerei',''],
    ['trocken','Konserven & Trockenes',''],
    ['getraenke','Getränke',''],
    ['haushalt','Haushalt','']
  ];
  var DISHES = [
    ['rouladen','Die Rouladen','Füllen, rollen, anbraten'],
    ['sauce','Die Schmorsoße','Zieht anderthalb Stunden mit'],
    ['gratin','Das Kartoffelgratin','Kommt parallel in den Ofen']
  ];

  var STEPS = [
    {phase:'Vorbereiten', dur:'15 Min.', items:[
      {id:'s1', text:'Zwiebeln schälen: zwei fein würfeln für die Füllung, eine grob für den Fond. Gewürzgurken längs vierteln, Suppengrün putzen und in grobe Stücke schneiden.'},
      {id:'s2', text:'Die Kalbsrouladen flach auf ein Brett legen, salzen, pfeffern und dünn mit Senf bestreichen.'},
      {id:'s3', text:'Auf jede Roulade ein bis zwei Scheiben Speck legen, die Zwiebelwürfel darauf verteilen und ein bis zwei Gurkenviertel ans breite Ende setzen.'},
      {id:'s4', text:'Die Längsseiten leicht einschlagen, vom breiten Ende her fest aufrollen und mit Küchengarn binden oder mit Rouladennadeln feststecken. Außen noch einmal salzen und pfeffern.'}
    ]},
    {phase:'Anbraten & schmoren', dur:'20 Min. + 90 Min.', items:[
      {id:'s5', text:'Butterschmalz im Schmortopf stark erhitzen und die Rouladen rundherum kräftig braun anbraten, dann herausnehmen. Diese Farbe ist später der Geschmack der Soße — hier nicht hetzen.'},
      {id:'s6', text:'Hitze etwas zurücknehmen, grobe Zwiebel und Suppengrün im Bratensatz anrösten, bis sie Farbe nehmen. Tomatenmark zugeben und ein bis zwei Minuten mitrösten, bis es dunkel wird und süßlich riecht.'},
      {id:'s7', text:'Mit {rotwein} Rotwein ablöschen und den Bratensatz vom Boden lösen. Fast vollständig einkochen lassen, dann {fond} Fond angießen, Lorbeer und Wacholder dazu.'},
      {id:'s8', text:'Rouladen zurück in den Topf legen — die Flüssigkeit sollte sie zu etwa zwei Dritteln bedecken. Zugedeckt bei kleiner Hitze 90 Minuten schmoren, dabei zweimal wenden.'}
    ]},
    {phase:'Das Gratin', dur:'15 Min. + 55–65 Min.', items:[
      {id:'s9',  text:'Ofen auf 180 °C Ober-/Unterhitze vorheizen. Auflaufform mit der halbierten Knoblauchzehe ausreiben, anschließend mit Butter ausstreichen.'},
      {id:'s10', text:'{kartoffeln} Kartoffeln schälen und in zwei bis drei Millimeter dünne Scheiben hobeln. Nicht wässern — die Stärke ist es, die das Gratin bindet.'},
      {id:'s11', text:'{sahne} Sahne und {milch} Milch verrühren und kräftig mit Salz, Pfeffer und frisch geriebener Muskatnuss würzen.'},
      {id:'s12', text:'Die Scheiben dachziegelartig einschichten, dazwischen etwas von den {kaese} Käse verteilen. Sahnemischung angießen, restlichen Käse obenauf, ein paar Butterflöckchen darauf.'},
      {id:'s13', text:'55 bis 65 Minuten backen. Wird der Käse zu früh dunkel, mit Folie abdecken und die letzten zehn Minuten offen fertig backen. Fertig ist es, wenn ein Messer ohne Widerstand durchgleitet.'}
    ]},
    {phase:'Soße & anrichten', dur:'10 Min.', items:[
      {id:'s14', text:'Rouladen aus dem Topf nehmen und warm stellen. Die Soße durch ein Sieb gießen, das Gemüse dabei gut ausdrücken, Lorbeer und Wacholder wegwerfen.'},
      {id:'s15', text:'Soße aufkochen. {mehl} Mehl in etwas kaltem Wasser glattrühren, einrühren und sämig kochen lassen. Mit Salz, Pfeffer und einem Löffel Senf abschmecken, zum Schluss ein Stück kalte Butter einrühren — das macht sie glänzend.'},
      {id:'s16', text:'Garn oder Nadeln entfernen, die Rouladen in der Soße kurz erwärmen. Mit dem Gratin anrichten und die gehackte Petersilie darüber geben.'}
    ]}
  ];

  // Minuten vor dem Essen; key = die drei Zeitpunkte, die wirklich sitzen müssen
  var PLAN = [
    [-135, 'Fleisch vorbereiten: füllen, rollen, binden', false],
    [-120, 'Rouladen anbraten, Röstgemüse und Fond ansetzen', false],
    [-100, 'Schmoren beginnt — 90 Minuten bei kleiner Hitze', true],
    [-75,  'Ofen anstellen, Kartoffeln hobeln, Gratin schichten', false],
    [-65,  'Gratin in den Ofen — 55 bis 65 Minuten', true],
    [-10,  'Rouladen herausnehmen, Soße passieren und binden', false],
    [0,    'Servieren', true]
  ];

  var BY_ID = {};
  ITEMS.forEach(function(i){ BY_ID[i.id] = i; });
  var ALL_STEPS = [];
  STEPS.forEach(function(ph){ ALL_STEPS = ALL_STEPS.concat(ph.items); });

  var MIN = 2, MAX = 10, LS = 'kalbsrouladen-einkauf-v1';
  var nf = new Intl.NumberFormat('de-DE', {maximumFractionDigits:2});

  // state.checked ist IMMER ein eigenes, beschreibbares Objekt. Snapshots aus
  // der Datenbank kommen eingefroren zurueck, deshalb wird alles von dort
  // kopiert, bevor es in den Zustand wandert.
  var state = {servings:4, checked:{}, steps:{}, mealTime:'18:00'};
  var view = 'route';
  var tab = 'einkauf';
  var lastEdit = 0;

  var elList = document.getElementById('list');
  var elCount = document.getElementById('count');
  var elRail = document.getElementById('rail');
  var elStatus = document.getElementById('status');
  var elServings = document.getElementById('servings');
  var elMinus = document.getElementById('minus');
  var elPlus = document.getElementById('plus');
  var elReset = document.getElementById('reset');
  var elSync = document.getElementById('sync');
  var elSyncText = document.getElementById('sync-text');
  var elRecipe = document.getElementById('recipe');
  var elSteps = document.getElementById('steps');
  var elPlan = document.getElementById('plan-list');
  var elMeal = document.getElementById('mealtime');
  var elSort = document.getElementById('sortierung');
  var elTabE = document.getElementById('t-einkauf');
  var elTabK = document.getElementById('t-kochen');

  function copyChecked(src){
    var out = {};
    if (src && typeof src === 'object'){
      for (var k in src){ if (Object.prototype.hasOwnProperty.call(src, k) && src[k]) out[k] = true; }
    }
    return out;
  }
  function clamp(n){ n = Math.round(n) || 4; return Math.min(MAX, Math.max(MIN, n)); }

  function qty(it, n){
    if (it.fixed) return it.fixed;
    var v = it.per * n;
    if (it.unit === 'Stück') { v = Math.ceil(v); }
    else { v = Math.round(v / it.step) * it.step; if (v < it.step) v = it.step; }
    if (it.unit === 'g'  && v >= 1000) return nf.format(v/1000) + ' kg';
    if (it.unit === 'ml' && v >= 1000) return nf.format(v/1000) + ' l';
    return nf.format(v) + ' ' + it.unit;
  }

  /* ---------- Speichern ---------- */
  function saveLocal(){
    try { localStorage.setItem(LS, JSON.stringify({servings:state.servings, checked:state.checked,
      steps:state.steps, mealTime:state.mealTime, view:view, tab:tab, rev:lastEdit})); } catch(e){}
  }
  function loadLocal(){
    try {
      var raw = localStorage.getItem(LS); if (!raw) return;
      var d = JSON.parse(raw); if (!d || typeof d !== 'object') return;
      if (typeof d.servings === 'number') state.servings = clamp(d.servings);
      state.checked = copyChecked(d.checked);
      state.steps = copyChecked(d.steps);
      if (typeof d.mealTime === 'string') state.mealTime = d.mealTime;
      if (typeof d.rev === 'number') lastEdit = d.rev;
      if (d.view === 'dish' || d.view === 'route') view = d.view;
      if (d.tab === 'kochen' || d.tab === 'einkauf') tab = d.tab;
    } catch(e){}
  }

  var doc = null, pushTimer = null, inflight = 0;

  function syncLabel(on, text){
    elSync.className = on ? 'sync live' : 'sync';
    elSyncText.textContent = text;
  }

  function push(){
    saveLocal();
    if (!doc) return;
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function(){
      pushTimer = null; inflight++;
      doc.set({servings:state.servings, checked:state.checked, steps:state.steps,
               mealTime:state.mealTime, rev:lastEdit, updatedAt:new Date().toISOString()})
        .then(function(){ inflight--; }, function(){
          inflight--; doc = null;
          syncLabel(false, 'Nur auf diesem Gerät gespeichert');
        });
    }, 350);
  }

  try {
    if (window.claude && typeof window.claude.use === 'function'){
      window.claude.use('db').then(function(db){
        if (!db) return;
        doc = db.doc('einkauf/kalbsrouladen');
        syncLabel(true, 'Wird geräteübergreifend gespeichert');
        doc.onSnapshot(function(snap){
          if (!snap.exists){ push(); return; }                       // erstmalig anlegen
          if (snap.metadata && snap.metadata.hasPendingWrites) return; // eigener Schreibvorgang
          if (pushTimer || inflight) return;                          // lokale Änderung unterwegs
          var d = snap.data() || {};
          if (typeof d.rev === 'number' && d.rev < lastEdit) return;   // veralteter Stand
          if (typeof d.servings === 'number') state.servings = clamp(d.servings);
          state.checked = copyChecked(d.checked);
          state.steps = copyChecked(d.steps);
          if (typeof d.mealTime === 'string') state.mealTime = d.mealTime;
          if (typeof d.rev === 'number') lastEdit = d.rev;
          saveLocal();
          render();
        }, function(){
          doc = null;
          syncLabel(false, 'Nur auf diesem Gerät gespeichert');
        });
      }).catch(function(){});
    }
  } catch(e){}

  /* ---------- Zeichnen ---------- */
  var tallies = [];   // {el, items} je Gruppe, fuer Aktualisierung ohne Neuaufbau

  function groups(){
    var src = view === 'dish' ? DISHES : AISLES;
    var key = view === 'dish' ? 'dish' : 'aisle';
    return src.map(function(g){
      return {label:g[1], hint:g[2], items:ITEMS.filter(function(i){ return i[key] === g[0]; })};
    });
  }

  function updateCounts(){
    tallies.forEach(function(t){
      var done = t.items.filter(function(i){ return state.checked[i.id]; }).length;
      t.el.textContent = done + '/' + t.items.length;
    });

    var kochen = tab === 'kochen';
    var pool = kochen ? ALL_STEPS : ITEMS;
    var map  = kochen ? state.steps : state.checked;
    var total = pool.length;
    var got = pool.filter(function(x){ return map[x.id]; }).length;
    var offen = total - got;

    elCount.textContent = '';
    elCount.appendChild(document.createTextNode(String(got)));
    var small = document.createElement('small'); small.textContent = '/' + total;
    elCount.appendChild(small);
    elRail.style.width = Math.round(got / total * 100) + '%';
    document.body.classList.toggle('done', got === total);

    if (kochen){
      elStatus.textContent = got === 0 ? 'Noch nicht angefangen'
        : got === total ? 'Fertig — guten Appetit'
        : 'Noch ' + offen + (offen === 1 ? ' Schritt' : ' Schritte');
    } else {
      elStatus.textContent = got === 0 ? 'Noch nichts im Wagen'
        : got === total ? 'Alles beisammen — ab in die Küche'
        : 'Noch ' + offen + (offen === 1 ? ' Position' : ' Positionen');
    }
    elReset.textContent = kochen ? 'Schritte zurücksetzen' : 'Alles abwählen';
  }

  // Mengenplatzhalter wie {kartoffeln} durch die berechnete Menge ersetzen
  function fillText(el, str){
    var re = /\{(\w+)\}/g, last = 0, m;
    while ((m = re.exec(str)) !== null){
      if (m.index > last) el.appendChild(document.createTextNode(str.slice(last, m.index)));
      var b = document.createElement('b');
      b.textContent = BY_ID[m[1]] ? qty(BY_ID[m[1]], state.servings) : m[0];
      el.appendChild(b);
      last = re.lastIndex;
    }
    if (last < str.length) el.appendChild(document.createTextNode(str.slice(last)));
  }

  function clock(offset){
    var parts = String(state.mealTime || '18:00').split(':');
    var h = parseInt(parts[0], 10), mi = parseInt(parts[1], 10);
    if (isNaN(h)) h = 18; if (isNaN(mi)) mi = 0;
    var total = ((h * 60 + mi + offset) % 1440 + 1440) % 1440;
    var hh = Math.floor(total / 60), mm = total % 60;
    return (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm;
  }

  function renderPlan(){
    elPlan.textContent = '';
    PLAN.forEach(function(row){
      var li = document.createElement('li');
      if (row[2]) li.className = 'key';
      var t = document.createElement('span'); t.className = 't'; t.textContent = clock(row[0]);
      var w = document.createElement('span'); w.className = 'what'; w.textContent = row[1];
      li.appendChild(t); li.appendChild(w); elPlan.appendChild(li);
    });
  }

  function renderSteps(){
    elSteps.textContent = '';
    var n = 0;
    STEPS.forEach(function(ph){
      var sec = document.createElement('section'); sec.className = 'phase';
      var head = document.createElement('div'); head.className = 'phase-head';
      var h2 = document.createElement('h2'); h2.textContent = ph.phase;
      var dur = document.createElement('span'); dur.className = 'dur'; dur.textContent = ph.dur;
      head.appendChild(h2); head.appendChild(dur); sec.appendChild(head);

      var ul = document.createElement('ul'); ul.className = 'steps';
      ph.items.forEach(function(st){
        n++;
        var li = document.createElement('li');
        var label = document.createElement('label');
        label.className = 'step' + (state.steps[st.id] ? ' on' : '');

        var input = document.createElement('input');
        input.type = 'checkbox'; input.id = 'chk-' + st.id;
        input.checked = !!state.steps[st.id];
        input.addEventListener('change', function(){ toggleStep(st, label, input.checked); });

        var num = document.createElement('span'); num.className = 'num';
        num.setAttribute('aria-hidden','true'); num.textContent = String(n);

        var text = document.createElement('span'); text.className = 'text';
        fillText(text, st.text);

        label.appendChild(input); label.appendChild(num); label.appendChild(text);
        li.appendChild(label); ul.appendChild(li);
      });
      sec.appendChild(ul); elSteps.appendChild(sec);
    });
  }

  function toggle(it, label, on){
    var next = copyChecked(state.checked);      // niemals in place aendern
    if (on) next[it.id] = true; else delete next[it.id];
    state.checked = next;
    lastEdit = Date.now();
    label.classList.toggle('on', !!on);
    updateCounts();
    push();
  }

  function toggleStep(st, label, on){
    var next = copyChecked(state.steps);
    if (on) next[st.id] = true; else delete next[st.id];
    state.steps = next;
    lastEdit = Date.now();
    label.classList.toggle('on', !!on);
    updateCounts();
    push();
  }

  function render(){
    var n = state.servings;
    elServings.textContent = n + (n === 1 ? ' Person' : ' Personen');
    elMinus.disabled = n <= MIN;
    elPlus.disabled = n >= MAX;
    document.getElementById('v-route').setAttribute('aria-pressed', String(view === 'route'));
    document.getElementById('v-dish').setAttribute('aria-pressed', String(view === 'dish'));

    var kochen = tab === 'kochen';
    elTabE.setAttribute('aria-selected', String(!kochen));
    elTabK.setAttribute('aria-selected', String(kochen));
    elList.hidden = kochen;
    elRecipe.hidden = !kochen;
    elSort.hidden = kochen;
    elMeal.value = state.mealTime;

    renderPlan();
    renderSteps();

    elList.textContent = '';
    tallies = [];

    groups().forEach(function(g){
      var sec = document.createElement('section');
      sec.className = 'group';

      var head = document.createElement('div');
      head.className = 'group-head';
      var h2 = document.createElement('h2'); h2.textContent = g.label;
      var tally = document.createElement('span'); tally.className = 'tally';
      head.appendChild(h2); head.appendChild(tally);
      sec.appendChild(head);
      tallies.push({el:tally, items:g.items});

      if (g.hint){
        var hint = document.createElement('p'); hint.className = 'hint'; hint.textContent = g.hint;
        sec.appendChild(hint);
      }

      var ul = document.createElement('ul'); ul.className = 'items';
      g.items.forEach(function(it){
        var li = document.createElement('li');
        var label = document.createElement('label');
        label.className = 'row' + (state.checked[it.id] ? ' on' : '');

        var input = document.createElement('input');
        input.type = 'checkbox';
        input.id = 'chk-' + it.id;
        input.checked = !!state.checked[it.id];
        input.addEventListener('change', function(){ toggle(it, label, input.checked); });

        var box = document.createElement('span'); box.className = 'box'; box.setAttribute('aria-hidden','true');

        var name = document.createElement('span'); name.className = 'name';
        name.appendChild(document.createTextNode(it.name));
        if (it.pantry){
          var chip = document.createElement('span'); chip.className = 'chip';
          chip.textContent = 'Vorrat prüfen'; name.appendChild(chip);
        }

        var q = document.createElement('span'); q.className = 'qty'; q.textContent = qty(it, n);

        label.appendChild(input); label.appendChild(box); label.appendChild(name); label.appendChild(q);
        if (it.note){
          var note = document.createElement('span'); note.className = 'note'; note.textContent = it.note;
          label.appendChild(note);
        }
        li.appendChild(label); ul.appendChild(li);
      });
      sec.appendChild(ul);
      elList.appendChild(sec);
    });

    updateCounts();
  }

  /* ---------- Bedienung ---------- */
  function setServings(v){
    state.servings = clamp(v);
    lastEdit = Date.now();
    push(); render();
  }
  elMinus.addEventListener('click', function(){ setServings(state.servings - 1); });
  elPlus .addEventListener('click', function(){ setServings(state.servings + 1); });
  function setTab(t){ tab = t; saveLocal(); render(); window.scrollTo(0, 0); }
  elTabE.addEventListener('click', function(){ setTab('einkauf'); });
  elTabK.addEventListener('click', function(){ setTab('kochen'); });

  elMeal.addEventListener('change', function(){
    state.mealTime = elMeal.value || '18:00';
    lastEdit = Date.now();
    renderPlan(); push();
  });

  document.getElementById('v-route').addEventListener('click', function(){ view = 'route'; saveLocal(); render(); });
  document.getElementById('v-dish') .addEventListener('click', function(){ view = 'dish';  saveLocal(); render(); });

  var armed = null;
  elReset.addEventListener('click', function(){
    if (!armed){
      elReset.classList.add('armed');
      elReset.textContent = 'Wirklich? Nochmal tippen';
      armed = setTimeout(function(){
        armed = null; elReset.classList.remove('armed'); elReset.textContent = 'Alles abwählen';
      }, 4000);
      return;
    }
    clearTimeout(armed); armed = null;
    elReset.classList.remove('armed'); elReset.textContent = 'Alles abwählen';
    if (tab === 'kochen') state.steps = {}; else state.checked = {};
    lastEdit = Date.now();
    push(); render();
  });

  loadLocal();
  render();
})();
</script>

</body>
</html>
